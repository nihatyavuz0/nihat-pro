<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#13161C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NİHAT PRO — Profesyonel SEO, GEO ve Reklam Otomasyon Ajanı</title>
  <meta name="description" content="Google Ads, Google Merchant Center ve Meta Ads için 3 katmanlı doğrulamalı profesyonel SEO & GEO yapay zeka ajanı." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Secure Login Gate (shown until authenticated) -->
  <div class="auth-gate hidden" id="auth-gate" role="main" aria-label="Güvenli Giriş"></div>

  <div class="app-shell hidden" id="app-shell">
    <!-- Mobile Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Left Navigation Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand-header">
        <div class="brand-logo">
          <img class="brand-logo-img logo-for-dark" src="assets/logo-dark.png" alt="NİHAT PRO Logo" />
          <img class="brand-logo-img logo-for-light" src="assets/logo-light.png" alt="NİHAT PRO Logo" />
        </div>
        <div class="brand-text">
          <span class="brand-name">NİHAT PRO</span>
          <span class="brand-sub">SEO · GEO · ADS AJANI</span>
        </div>
        <button class="icon-btn mobile-close-btn" id="mobile-close-btn" aria-label="Menüyü Kapat">✕</button>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Ana Menü">
        <div class="nav-group-label">YÖNETİM PANELİ</div>
        <button class="nav-item active" data-route="dashboard">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          </span>
          <span class="nav-label">Günlük Özet</span>
        </button>

        <button class="nav-item" data-route="site-audit">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 7v4l2.5 2.5"/></svg>
          </span>
          <span class="nav-label">Site SEO & GEO Testi</span>
        </button>

        <button class="nav-item" data-route="approvals">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
          </span>
          <span class="nav-label">Onay & Hata Düzeltme</span>
          <span class="nav-badge" id="nav-approval-badge">0</span>
        </button>

        <div class="nav-group-label">REKLAM & BÜYÜME</div>
        <button class="nav-item" data-route="campaigns">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          </span>
          <span class="nav-label">Google & Meta Reklamlar</span>
        </button>

        <button class="nav-item" data-route="content">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </span>
          <span class="nav-label">İçerik & Blog Stüdyosu</span>
        </button>

        <div class="nav-group-label">İSTİHBARAT</div>
        <button class="nav-item" data-route="competitors">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </span>
          <span class="nav-label">Rakip Analizi</span>
        </button>

        <button class="nav-item" data-route="audience">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          </span>
          <span class="nav-label">Hedef Kitle Araştırması</span>
        </button>

        <div class="nav-group-label">ALTYAPI</div>
        <button class="nav-item" data-route="apis">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          </span>
          <span class="nav-label">API Bağlantıları</span>
          <span class="nav-dot" id="nav-api-dot"></span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="quiet-status">
          <span class="pulse-dot"></span>
          <span class="server-pill" id="server-status-pill">Bağlantı kontrol ediliyor...</span>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu-btn" id="mobile-menu-btn" aria-label="Menüyü Aç">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div>
            <h1 class="page-title" id="page-title">Günlük Özet</h1>
            <p class="page-subtitle" id="page-subtitle">Bugünkü SEO, GEO ve reklam sağlığınızın sade özeti</p>
          </div>
        </div>

        <div class="topbar-actions">
          <button class="btn btn-soft-amber" id="topbar-approvals-btn" title="Onay bekleyen hata düzeltmeleri">
            <span class="dot-amber"></span>
            <span id="topbar-approval-text">0 Onay Bekliyor</span>
          </button>
          <button class="btn btn-primary" id="run-full-audit-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            <span>3x Denetle</span>
          </button>
          <button class="icon-btn" id="security-shield-btn" title="Güvenlik Kalkanı & Oturum" aria-label="Güvenlik Kalkanı">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
          </button>
          <button class="icon-btn" id="theme-toggle-btn" title="Açık / Koyu Tema Değiştir" aria-label="Tema Değiştir">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <main class="view-root" id="view-root"></main>

      <!-- Mobile Thumb-First Bottom Navigation Bar -->
      <nav class="mobile-tabbar" id="mobile-tabbar" aria-label="Mobil Alt Menü">
        <button class="mtab-item active" data-route="dashboard">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Özet</span>
        </button>
        <button class="mtab-item" data-route="site-audit">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Site Testi</span>
        </button>
        <button class="mtab-item" data-route="approvals">
          <span class="mtab-icon-wrap">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            <span class="mtab-badge hidden" id="mobile-approval-badge">0</span>
          </span>
          <span>Onaylar</span>
        </button>
        <button class="mtab-item" data-route="campaigns">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          <span>Reklam</span>
        </button>
        <button class="mtab-item" id="mobile-more-btn" type="button">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          <span>Menü</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Modal Container -->
  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal-card" id="modal-card" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Toast Container -->
  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/analyzer.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/siteAudit.js"></script>
  <script src="js/views/approvals.js"></script>
  <script src="js/views/campaigns.js"></script>
  <script src="js/views/content.js"></script>
  <script src="js/views/competitors.js"></script>
  <script src="js/views/audience.js"></script>
  <script src="js/views/apis.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
